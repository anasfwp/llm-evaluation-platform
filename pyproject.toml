[project]
name = "llm-evaluation-platform"
version = "0.1.0"
description = "Repeatable evaluation of LLM and RAG applications: metrics, comparisons, and CI quality gates."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "celery[redis]>=5.4",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
llm-eval = "app.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's long single-line operations.
"backend/alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# backend/alembic (the migrations folder) would otherwise shadow the alembic package.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
mypy_path = "backend"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true
