name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Lint, type-check, test, evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov=app --cov-report=term --cov-report=xml

      # Deterministic fake provider only: no API keys, no network, no cost.
      - name: Validate demo evaluation config
        run: uv run llm-eval validate --config evals/demo_config.yaml

      - name: Run demo evaluation and enforce gate
        run: >-
          uv run llm-eval run --config evals/demo_config.yaml
          --output reports/demo-run.json --markdown reports/demo-run.md

      - name: Run RAG demo evaluation and enforce gate
        run: >-
          uv run llm-eval run --config evals/demo_rag_config.yaml
          --gates evals/gates.rag.yaml
          --output reports/demo-rag-run.json --markdown reports/demo-rag-run.md

      - name: Regression gate against the committed baseline
        run: >-
          uv run llm-eval gate --report reports/demo-run.json
          --rules evals/gates.regression.yaml
          --baseline evals/baselines/demo-baseline.json

      - name: Regression report against the committed baseline
        run: >-
          uv run llm-eval compare --baseline evals/baselines/demo-baseline.json
          --candidate reports/demo-run.json --fail-on-regression
          --markdown reports/demo-comparison.md

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            reports/*.json
            reports/*.md
            coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Dashboard type-check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # scan the whole history, not just the last commit

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.21.2

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Audit Python dependencies (pip-audit)
        run: |
          uv sync --locked --python 3.12
          uv run --with pip-audit pip-audit --skip-editable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=moderate

  postgres:
    name: Migrations and API tests on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eval_user
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: llm_eval
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eval_user -d llm_eval"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://eval_user:ci_only_password@localhost:5432/llm_eval
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Models and migrations agree
        run: uv run alembic check

      - name: Migrations downgrade cleanly
        run: uv run alembic downgrade base

      - name: API integration tests
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: uv run pytest backend/tests/integration

  docker:
    name: Container image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t llm-eval-backend:ci .
