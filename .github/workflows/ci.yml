name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Lint, type-check, test, evaluation gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests
        run: uv run pytest --cov=app --cov-report=term --cov-report=xml

      # Deterministic fake provider only: no API keys, no network, no cost.
      - name: Validate demo evaluation config
        run: uv run llm-eval validate --config evals/demo_config.yaml

      - name: Run demo evaluation and enforce gate
        run: >-
          uv run llm-eval run --config evals/demo_config.yaml
          --output reports/demo-run.json --markdown reports/demo-run.md

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: |
            reports/*.json
            reports/*.md
            coverage.xml
          if-no-files-found: ignore
